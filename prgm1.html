<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Details</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f8fc;
            margin: 30px;
        }

        .container {
            width: 600px;
            margin: auto;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #2c3e50;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            text-align: left;
            padding: 10px;
            background-color: #e3eaf1;
            color: #333;
        }

        td {
            padding: 10px;
            vertical-align: top;
        }

        img {
            width: 120px;
            height: 120px;
            border-radius: 10px;
            object-fit: cover;
        }

        .address-box {
            background-color: #f0f0f0;
            padding: 10px;
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Personal Details</h2>

        <table border="1">

            <tr>
                <th>Name</th>
                <td>Razal</td>
                <td rowspan="5" style="text-align:center;">
                    <img src="https://www.yenepoya.edu.in/img/Yen%20new%20Logo.png" alt="Profile Photo">
                </td>
            </tr>

            <tr>
                <th>Class</th>
                <td>LH-84</td>
            </tr>

            <tr>
                <th>Qualification</th>
                <td>PUC</td>
            </tr>

            <tr>
                <th>Email</th>
                <td>razal@example.com</td>
            </tr>

            <tr>
                <th>Phone</th>
                <td>+9177368*****</td>
            </tr>

            <tr>
                <th>Address</th>
                <td colspan="2">
                    <div class="address-box">
                        India,<br>
                        City, State - 123456
                    </div>
                </td>
            </tr>

        </table>

    </div>

</body>
</html>
